name: Install Zoom Review

on:
  push:
    branches: [main]
    paths:
      - 'zoom-review.js'
      - '.github/workflows/install-zoom-review.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Zoom Review script to dashboard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('inedx.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="zoom-review.js"></script>'
          if tag not in s:
              s=s.replace('</body>', tag+'\n</body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit dashboard update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add inedx.html
          git diff --cached --quiet && exit 0
          git commit -m "Enable Zoom incident review tab"
          git push
