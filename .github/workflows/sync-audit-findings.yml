name: Sync Audit Findings

on:
  push:
    paths:
      - scripts/sync-audit-findings.js
      - .github/workflows/sync-audit-findings.yml
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run audit findings sync
        env:
          SMARTSHEET_TOKEN: ${{ secrets.SMARTSHEET_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_KEY }}
          AUDIT_SMARTSHEET_SOURCES: ${{ vars.AUDIT_SMARTSHEET_SOURCES }}
        run: node scripts/sync-audit-findings.js
